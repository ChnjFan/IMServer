syntax = "proto3";

package message;

service VerifyService {
    rpc GetVerifyCode(GetVerifyReq) returns (GetVerifyRsp);
}

message GetVerifyReq {
    string email = 1;
}

message GetVerifyRsp {
    int32 error = 1;
    string email = 2;
    string code = 3;
}

service StatusService {
    rpc GetChatServer(GetChatServerReq) returns (GetChatServerRsp);
    rpc Login(LoginReq) returns (LoginRsp);
}

message GetChatServerReq {
    int32 uid = 1;
}

message GetChatServerRsp {
    int32 error = 1;
    string host = 2;
    string port = 3;
    string token = 4;
}

message LoginReq {
    int32 uid = 1;
    string token = 2;
}

message LoginRsp {
    int32 error = 1;
    int32 uid = 2;
    string token = 3;
}

service ChatService {
    rpc NotifyAddFriend(ChatServiceReq) returns (ChatServiceRsp);
    rpc ReplyAddFriend(ChatServiceReq) returns (ChatServiceRsp);
    rpc SendChatMsg(ChatServiceReq) returns (ChatServiceRsp);
    rpc NotifyAuthFriend(ChatServiceReq) returns (ChatServiceRsp);
    rpc NotifyTextChatMsg(ChatServiceReq) returns (ChatServiceRsp);
    rpc NotifyOffline(ChatServiceReq) returns (ChatServiceRsp);
}

message ChatServiceReq {
    int32 from_uid = 1;
    int32 to_uid = 2;
    string json = 3;
}

message ChatServiceRsp {
    int32 error = 1;
    int32 from_uid = 2;
    int32 to_uid = 3;
    string json = 4;
}